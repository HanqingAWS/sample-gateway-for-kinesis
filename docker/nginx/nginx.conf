worker_processes 4;
worker_rlimit_nofile 65535;

# Pass environment variables to Lua (Nginx strips env by default)
env VECTOR_HOST;
env VECTOR_PORT;

events {
    worker_connections 65535;
    use epoll;
}

http {
    keepalive_timeout 0;
    client_max_body_size 1m;
    access_log off;

    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/lualib/?.lua;/etc/nginx/lua/?.lua;;";

    # DNS resolver: try Docker DNS first, then fall back to public DNS
    # In ECS Fargate, 127.0.0.11 doesn't exist, so we add 169.254.169.253 (VPC DNS)
    resolver 127.0.0.11 169.254.169.253 valid=10s ipv6=off;

    # Vector host/port set via Lua shared dict for init_by_lua
    init_by_lua_block {
        VECTOR_HOST = os.getenv("VECTOR_HOST") or "127.0.0.1"
        VECTOR_PORT = os.getenv("VECTOR_PORT") or "8686"
    }

    server {
        listen 8080;

        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location / {
            content_by_lua_file /etc/nginx/lua/collect.lua;
        }
    }
}
