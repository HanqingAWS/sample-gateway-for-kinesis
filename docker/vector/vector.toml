data_dir = "/var/lib/vector"

# ──────────────────────────────────────────
# Source: receive JSON from Nginx Lua
# ──────────────────────────────────────────
[sources.nginx_events]
type = "http_server"
address = "0.0.0.0:8686"
decoding.codec = "json"

# ──────────────────────────────────────────
# Transform: clean metadata fields before sending to Kinesis
# ──────────────────────────────────────────
[transforms.clean]
type = "remap"
inputs = ["nginx_events"]
source = '''
del(._path)
del(.partition_key)
del(.path)
del(.source_type)
del(.timestamp)
'''

# ──────────────────────────────────────────
# Sink: Kinesis stream with disk buffer
# ──────────────────────────────────────────
[sinks.kinesis]
type = "aws_kinesis_streams"
inputs = ["clean"]
region = "${KINESIS_REGION:?}"
stream_name = "${KINESIS_STREAM_NAME:?}"
encoding.codec = "json"
compression = "none"

  [sinks.kinesis.buffer]
  type = "disk"
  max_size = 858993459200
  when_full = "block"

  [sinks.kinesis.batch]
  max_events = 500
  max_bytes = 5000000
  timeout_secs = 1
