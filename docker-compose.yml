version: "3.8"

services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - vector
    networks:
      - gateway-net

  vector:
    build:
      context: ./docker/vector
      dockerfile: Dockerfile
    environment:
      - KINESIS_REGION=${KINESIS_REGION:-ap-northeast-1}
      - KINESIS_STREAM_NAME=${KINESIS_STREAM_NAME:-guangdiantong_attribution_event}
      - AWS_REGION=${KINESIS_REGION:-ap-northeast-1}
      - EBS_RETENTION_HOURS=${EBS_RETENTION_HOURS:-24}
      - EBS_RECLAIM_PERCENT=${EBS_RECLAIM_PERCENT:-80}
    volumes:
      - vector-data:/var/lib/vector
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

volumes:
  vector-data:
    driver: local
